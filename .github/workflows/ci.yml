name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YT_DLP_COOKIES: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
      - name: Install GLib build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Build extension (includes GNOME typecheck)
        run: bun run extension:build

# GNOME smoke tests run separately in an isolated desktop session; this job
# does not claim coverage of GNOME versions unavailable on this runner.
