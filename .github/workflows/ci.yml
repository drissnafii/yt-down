name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YT_DLP_COOKIES: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
      - name: Install GJS and media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin gjs python3 ffmpeg
      - name: Install checksum-verified yt-dlp for integration tests
        env:
          YT_DOWN_CI_RELEASE: "2026.10.26"
          YT_DOWN_CI_SHA256: e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3
        run: |
          mkdir -p "$RUNNER_TEMP/yt-down-tools"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            "https://github.com/yt-dlp/yt-dlp/releases/download/$YT_DOWN_CI_RELEASE/yt-dlp" \
            --output "$RUNNER_TEMP/yt-down-tools/yt-dlp"
          printf '%s  %s\n' "$YT_DOWN_CI_SHA256" "$RUNNER_TEMP/yt-down-tools/yt-dlp" | sha256sum --check
          chmod +x "$RUNNER_TEMP/yt-down-tools/yt-dlp"
          echo "$RUNNER_TEMP/yt-down-tools" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Build extension (includes GNOME typecheck)
        run: bun run extension:build

# GNOME smoke tests run separately in an isolated desktop session; this job
# does not claim coverage of GNOME versions unavailable on this runner.
