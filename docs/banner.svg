  <!-- Arrow -->
  <path d="M416 48 v22 m-7 -7 l7 7 l7 -7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title -->
  <text x="416.5" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">VidLoom</text>

  <!-- Subtitle -->
  <text x="416.5" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#d0d0d0" text-anchor="middle">Save videos and audio, right from your GNOME panel.</text>

